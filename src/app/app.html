<div class="min-h-screen bg-surface text-on-surface flex flex-col selection:bg-primary/25 selection:text-on-surface relative">
  <app-mosaic-transition />

  @if (lib.currentView() !== 'reader') {
    <app-site-header />
  }

  <app-global-modals />

  <main id="main-content" class="flex-1 w-full" [class.pt-[76px]]="lib.currentView() !== 'reader'" [class.sm:pt-[84px]]="lib.currentView() !== 'reader'">
    <router-outlet />
  </main>

  @if (lib.currentView() !== 'reader') {
    <app-site-footer />
  }
</div>
