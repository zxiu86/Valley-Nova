    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="منصة أدبية رفيعة لقراءة الروايات والملاحم والفلسفة والتراث بتقنية MTX وتجربة قراءة صافية ثنائية اللغة." />
    <meta property="og:title" content="أروقة الخلود | منصة القراءة والأدب الرفيع" />
    <meta property="og:description" content="منصة أدبية رفيعة لقراءة الروايات والملاحم والفلسفة والتراث بتقنية MTX وتجربة قراءة صافية ثنائية اللغة." />

    <link rel="icon" type="image/x-icon" href="logo.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assist/img/logo.png" />
    <link rel="apple-touch-icon" href="assist/img/logo.png" />
    <link rel="shortcut icon" href="assist/img/logo.ico" />
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var savedTheme = localStorage.getItem('mtx_site_theme');
          if (savedTheme === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {
          root.classList.add('dark');
        }
        try {
          var savedLang = localStorage.getItem('mtx_site_lang');
          var lang = 'ar';
          if (savedLang === 'ar' || savedLang === 'en') {
            lang = savedLang;
          } else if (typeof navigator !== 'undefined') {
            var navLang = (
              (navigator.languages && navigator.languages[0]) ||
              navigator.language ||
              ''
            ).toLowerCase();
            if (navLang.indexOf('en') === 0) lang = 'en';
          }
          root.setAttribute('lang', lang);
          root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {
          root.setAttribute('lang', 'ar');
          root.setAttribute('dir', 'rtl');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
